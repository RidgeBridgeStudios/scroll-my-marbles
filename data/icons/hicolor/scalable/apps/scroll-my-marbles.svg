<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background trackball mouse body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d40"/>
      <stop offset="60%" stop-color="#212529"/>
      <stop offset="100%" stop-color="#121416"/>
    </linearGradient>

    <!-- Glossy TrackMan Red Marble Gradient -->
    <radialGradient id="marbleGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="25%" stop-color="#e61c24"/>
      <stop offset="70%" stop-color="#a80710"/>
      <stop offset="100%" stop-color="#540005"/>
    </radialGradient>

    <!-- Marble speckles / dots pattern (classic Logitech Marble look) -->
    <radialGradient id="marbleSheen" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Scroll arrows glowing gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38d9a9"/>
      <stop offset="100%" stop-color="#20c997"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Trackball Mouse Body Shell -->
  <path d="M 64 6 C 30 6, 12 36, 12 78 C 12 108, 34 122, 64 122 C 94 122, 116 108, 116 78 C 116 36, 98 6, 64 6 Z"
        fill="url(#bodyGrad)" filter="url(#shadow)" stroke="#495057" stroke-width="2"/>

  <!-- Left / Right Button Seam -->
  <path d="M 64 6 L 64 34" stroke="#16181b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 24 38 C 40 44, 88 44, 104 38" stroke="#16181b" stroke-width="2" fill="none"/>

  <!-- Marble Socket Outer Ring -->
  <circle cx="64" cy="74" r="38" fill="#181a1b" stroke="#343a40" stroke-width="2.5"/>

  <!-- Red Marble Ball -->
  <circle cx="64" cy="74" r="33" fill="url(#marbleGrad)"/>

  <!-- Classic Marble Dark Speckles -->
  <circle cx="56" cy="66" r="1.5" fill="#2d0002" opacity="0.6"/>
  <circle cx="72" cy="70" r="1.8" fill="#2d0002" opacity="0.5"/>
  <circle cx="60" cy="82" r="1.6" fill="#2d0002" opacity="0.6"/>
  <circle cx="78" cy="80" r="1.4" fill="#2d0002" opacity="0.5"/>
  <circle cx="50" cy="76" r="1.5" fill="#2d0002" opacity="0.5"/>
  <circle cx="68" cy="62" r="1.3" fill="#2d0002" opacity="0.6"/>

  <!-- Marble Gloss / Specular Highlight -->
  <ellipse cx="54" cy="62" rx="14" ry="9" fill="url(#marbleSheen)" transform="rotate(-20 54 62)"/>

  <!-- Scroll Motion Indicator Rings -->
  <!-- Top Scroll Arrow -->
  <g fill="url(#arrowGrad)" opacity="0.95">
    <path d="M 64 12 L 57 21 L 71 21 Z"/>
    <rect x="62" y="22" width="4" height="4" rx="1"/>
  </g>

  <!-- Bottom Scroll Arrow -->
  <g fill="url(#arrowGrad)" opacity="0.95">
    <path d="M 64 116 L 57 107 L 71 107 Z"/>
    <rect x="62" y="102" width="4" height="4" rx="1"/>
  </g>

  <!-- Left Scroll Arrow -->
  <g fill="url(#arrowGrad)" opacity="0.75">
    <path d="M 18 74 L 25 68 L 25 80 Z"/>
  </g>

  <!-- Right Scroll Arrow -->
  <g fill="url(#arrowGrad)" opacity="0.75">
    <path d="M 110 74 L 103 68 L 103 80 Z"/>
  </g>
</svg>
